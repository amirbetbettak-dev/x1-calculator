name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Pillow
        run: pip install pillow

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Build web assets
        run: npm run build

      - name: Add and Sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android App Launcher Icons from custom icon
        run: |
          python3 -c "
          from PIL import Image
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          icon = Image.open('assets/icon.png').convert('RGBA')
          for folder, size in sizes.items():
              d = f'android/app/src/main/res/{folder}'
              os.makedirs(d, exist_ok=True)
              im = icon.resize((size, size), Image.Resampling.LANCZOS)
              im.save(f'{d}/ic_launcher.png')
              im.save(f'{d}/ic_launcher_round.png')
              im.save(f'{d}/ic_launcher_foreground.png')
          print('Custom Android icons successfully applied!')
          "

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X1-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Package and Release APK & ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./X1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./x1-calculator.apk
          zip -j ./X1.zip ./X1.apk
          gh release upload v1.0.0 ./X1.apk ./x1-calculator.apk ./X1.zip --clobber || true
          mkdir -p downloads
          cp ./X1.apk downloads/X1.apk
          cp ./X1.zip downloads/X1.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/X1.apk downloads/X1.zip
          git commit -m "Update X1.apk and X1.zip binary downloads [skip ci]" || true
          git push origin main || true
